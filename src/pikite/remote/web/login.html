<!DOCTYPE html>
<html>

    <head>
        <!--Import Google Icon Font-->
        <link type="text/css" rel="stylesheet" href="static/css/material_icons.css"/>

        <!--Import materialize.css-->
        <link type="text/css" rel="stylesheet" href="static/css/materialize.css"  media="screen,projection"/>

        <!--Import custom styles-->
        <link type="text/css" rel="stylesheet" href="static/css/styles.css"/>

        <!--Let browser know website is optimized for mobile-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <title>PiKite Ground Station</title>
        <link rel="icon" href="static/images/favicon.svg" />
    </head>

    <body>
        <div class="container valign-wrapper" style="height: 100vh;">
            <div class="card">
                <div class="card-content">
                    <img src="static/images/logo.svg" alt="PiKite Logo" class="center-align" style="width: 100%;">
                    <h1 class="card-title center-align">Login</h1>
                    <form id="login-form">
                        <div class="input-field">
                            <input id="username" type="text" required>
                            <label for="username">Username</label>
                        </div>
                        <div class="input-field">
                            <input id="password" type="password" required>
                            <label for="password">Password</label>
                        </div>
                        <div class="center-align">
                            <button class="btn waves-effect waves-light" type="submit">Login</button>
                        </div>
                        <p id="login-error" class="red-text center-align" style="display:none; margin-top: 1em;"></p>
                    </form>
                </div>
            </div>
        </div>

        <!-- JS -->
        <script type="text/javascript" src="static/js/materialize.js"></script>
        
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const form = document.getElementById('login-form');
                const errorMsg = document.getElementById('login-error');
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    errorMsg.style.display = 'none';
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    try {
                        const response = await fetch("http://" + location.host + "/login", {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        if (!response.ok) {
                            throw new Error('Invalid credentials');
                        }
                        const data = await response.json();
                        if (data.token) {
                            localStorage.setItem('session_token', data.token);
                            window.location.href = 'index.html';
                        } else {
                            throw new Error('No token received');
                        }
                    } catch (err) {
                        errorMsg.textContent = err.message;
                        errorMsg.style.display = 'block';
                    }
                });
            });
        </script>
    </body>
</html>
